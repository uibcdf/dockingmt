[build-system]
requires = ["setuptools>=68", "versioningit~=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dockingmt"
dynamic = ["version"]
description = "DockingMT — The molecular docking layer of MolSysSuite"
readme = "README.md"
authors = [
  { name = "UIBCDF Development Team" }
]
license = { text = "MIT" }
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "argdigest",
  "depdigest",
  "molsysmt",
  "numpy",
  "pyunitwizard",
  "smonitor",
]

[project.optional-dependencies]
vina = [
  "vina",
]
test = [
  "pytest>=8",
  "pytest-cov",
  "pytest-receptor",
  "rdkit",
]
viewer = [
  "molsysviewer",
]
dev = [
  "ruff==0.16.5",
]

[project.entry-points."molsysviewer.addons"]
dockingmt = "molsysviewer_dockingmt"

[project.urls]
Homepage = "https://github.com/uibcdf/dockingmt"
Repository = "https://github.com/uibcdf/dockingmt"
Documentation = "https://uibcdf.org/dockingmt"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
include = ["dockingmt*", "molsysviewer_dockingmt*"]
namespaces = true
where = ["."]

[tool.setuptools.package-data]
dockingmt = [
  "py.typed",
]

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[tool.versioningit.write]
file = "dockingmt/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = [
  "*.egg", ".*", "build", "dist", "devguide",
]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi"]
extend-exclude = [
  "GH_RUN_RECEPTOR_GUIDE.md",
  "MOLSYSSUITE_GUIDE.md",
  "PYTEST_RECEPTOR_GUIDE.md",
  "SMONITOR_GUIDE.md",
  "DEPDIGEST_GUIDE.md",
  "ARGDIGEST_GUIDE.md",
  "PYUNITWIZARD_GUIDE.md",
  "GH_RUN_RECEPTOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dockingmt"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
exclude = ["*.md"]
