[build-system]
requires = ["setuptools>=77.0.3", "versioningit~=3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bindingmt"
dynamic = ["version"]
description = "BindingMT — Molecular binding modelling and characterization for MolSysSuite"
readme = "README.md"
authors = [
  { name = "UIBCDF Development Team" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.15"
dependencies = [
  "argdigest",
  "depdigest",
  "molsysmt",
  "numpy",
  "pyunitwizard>=0.29.3",
  "smonitor",
]

[project.optional-dependencies]
vina = [
  "vina",
]
test = [
  "packaging",
  "pytest>=8",
  "pytest-cov",
  "pytest-receptor==1.2.2",
  "rdkit",
  "unyt",
]
viewer = [
  "molsysviewer",
]
dev = [
  "ruff==0.16.5",
]

[project.entry-points."molsysviewer.addons"]
bindingmt = "molsysviewer_bindingmt"

[project.urls]
Homepage = "https://github.com/uibcdf/bindingmt"
Repository = "https://github.com/uibcdf/bindingmt"
Documentation = "https://github.com/uibcdf/bindingmt/blob/main/README.md"

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
include = ["bindingmt", "bindingmt.*", "molsysviewer_bindingmt", "molsysviewer_bindingmt.*"]
namespaces = true
where = ["."]

[tool.setuptools.package-data]
bindingmt = [
  "py.typed",
]

[tool.versioningit]
default-version = "0.0.0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.0.0"

[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[tool.versioningit.write]
file = "bindingmt/_version.py"

[tool.pytest.ini_options]
receptor_rerun_command = "python -m pytest"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
norecursedirs = [
  "*.egg", ".*", "build", "dist", "devguide",
]

[tool.ruff]
target-version = "py311"
line-length = 88
include = ["*.py", "*.pyi"]
extend-exclude = [
  ".molsyssuite",
  ".molsyssuite-tools",
  "GH_RUN_RECEPTOR_GUIDE.md",
  "MOLSYSSUITE_GUIDE.md",
  "PYTEST_RECEPTOR_GUIDE.md",
  "SMONITOR_GUIDE.md",
  "DEPDIGEST_GUIDE.md",
  "ARGDIGEST_GUIDE.md",
  "PYUNITWIZARD_GUIDE.md",
  "GH_RUN_RECEPTOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bindingmt", "molsysviewer_bindingmt"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
exclude = ["*.md"]
