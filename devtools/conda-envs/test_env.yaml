channels:
  - uibcdf
  - conda-forge
dependencies:
  - python >=3.11,<3.15
  - pip
  # DockingMT's PEP 639 build floor; also required by Vina Python metadata.
  - setuptools >=77.0.3
  - wheel
  - pytest
  - pytest-cov
  - pytest-receptor
  - smonitor >=0.16.0
  - depdigest >=0.15.1
  - pyunitwizard >=0.28.1
  - numpy
  - scipy
  - vina
  # Complete molecular graphs for flexible-ligand preparation tests.
  - rdkit
  # Runtime dependencies for the fixed scientific sibling sources below.
  - biopython
  # The current reference PDB profile uses MolSysMT's optional OpenMM bond inference.
  # Native, explicitly selected inference is tracked by uibcdf/molsysmt#304.
  - openmm
  - h5py
  - pandas
  - networkx
  - tqdm
  - matplotlib
  - py-mmcif >=1.1.1
  - aiohttp
  - anywidget
  - packaging
  - traitlets
