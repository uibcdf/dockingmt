required_steps = ["Install exact artifact", "Validate installed files", "Run installed tests", "Recheck installed provenance after scientific tests"]

[installed_tests]
# Whole existing suite; optional unavailable integrations retain their explicit skips.
paths = ["tests"]
# The source pytest profile adds the owner root; installed imports must exclude it.
pytest_args = ["--receptor=ci", "-v", "-o", "pythonpath="]
# Native test tools observed in source CI 37589149276; not new core API floors.
# #66 adds the locally exercised unit-backend snapshot, not a runtime API floor.
# All proposed installed cells still require actual solver/science qualification.
conda_dependencies = ["vina==1.2.7", "rdkit==2026.03.1", "openmm==8.6.1", "unyt==3.1.0"]

