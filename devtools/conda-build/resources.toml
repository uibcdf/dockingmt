[installed_gate]
workflow = ".github/workflows/test_installed_conda_package.yaml"
platforms = ["linux-64", "osx-arm64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
prepare_job = "installed / prepare"
job_template = "installed / {platform} · Python {python}"
required_steps = ["Install exact artifact", "Validate installed files", "Run installed tests", "Recheck dependency provenance after installed tests"]

[installed_tests]
# Whole existing suite; optional unavailable integrations retain their explicit skips.
paths = ["tests"]
# The source pytest profile adds the owner root; installed imports must exclude it.
pytest_args = ["--receptor=ci", "-v", "-o", "pythonpath="]
# Exact test tools observed in source CI 37589149276; not new core API floors.
# All proposed installed cells still require actual solver/science qualification.
conda_dependencies = ["vina==1.2.7", "rdkit==2026.03.1", "openmm==8.6.1"]
