package:
  name: bindingmt
  version: "{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}"
source:
  path: ../../
build:
  number: {{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  string: py_{{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  noarch: python
requirements:
  host:
    - python >=3.11,<3.15
    - pip
    - setuptools >=77.0.3
    - versioningit ~=3.0
    - wheel
  run:
    - python >=3.11,<3.15
    - argdigest
    - depdigest
    - molsysmt
    - numpy
    - pyunitwizard
    - smonitor
test:
  imports:
    - bindingmt
  commands:
    - python -c "import importlib.metadata as m; assert m.version('bindingmt') == '{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}'"
about:
  home: https://github.com/uibcdf/bindingmt
  license: MIT
  license_file: LICENSE
  summary: Molecular binding modelling and characterization for MolSysSuite
  dev_url: https://github.com/uibcdf/bindingmt
  doc_url: https://github.com/uibcdf/bindingmt/blob/main/README.md
