# Example only: review and commit release_plan.toml before an actual candidate.
# 0.0.0/build 0 are examples, not a release decision or authorization.
schema = "molsyssuite.conda-plan@1"
package = "dockingmt"
version = "0.0.0"
build_number = 0
route = "staged"
profile = "noarch-python"
reason = "First Conda route requires staged installed qualification; replace for the actual candidate."
decision_by = "Example only; replace with responsible maintainer and date."
artifact_subdirs = ["noarch"]
test_platforms = ["linux-64", "osx-arm64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
required_workflows = [".github/workflows/ci.yml", ".github/workflows/full-matrix.yml", ".github/workflows/molsyssuite-policy.yml", ".github/workflows/conda_publication_governance.yaml"]
requires_installed_gate = true
new_compatibility_surface = true
coupled_release = false
dependencies_public = false

[gate_jobs.".github/workflows/ci.yml"]
"Quality on ubuntu-latest" = ["Check Ruff lint", "Check Ruff format"]
"Distribution governance on Linux Python 3.14" = ["Validate report records and generated indexes", "Review declared dependency routes", "Test distribution controls"]
"Test on ubuntu-latest, Python 3.11" = ["Check dependency routes and installed clone context", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Test on ubuntu-latest, Python 3.12" = ["Check dependency routes and installed clone context", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Test on ubuntu-latest, Python 3.13" = ["Check dependency routes and installed clone context", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Test on ubuntu-latest, Python 3.14" = ["Check dependency routes and installed clone context", "Verify ordinary installed package", "Run tests with pytest-receptor"]

[gate_jobs.".github/workflows/full-matrix.yml"]
"Full test on ubuntu-latest, Python 3.11" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Full test on ubuntu-latest, Python 3.12" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Full test on ubuntu-latest, Python 3.13" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Full test on ubuntu-latest, Python 3.14" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Full test on macos-15, Python 3.13" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]
"Full test on macos-15, Python 3.14" = ["Check dependency routes and installed clone context", "Verify interpreter, architecture and required backend", "Verify ordinary installed package", "Run tests with pytest-receptor"]

[gate_jobs.".github/workflows/molsyssuite-policy.yml"]
"policy / conformance" = ["Check repository conformance", "Check Python lint and imports", "Check Python formatting"]

[gate_jobs.".github/workflows/conda_publication_governance.yaml"]
"publication / check" = ["Check publication workflow controls", "Check declared noarch recipe and resources without building"]
