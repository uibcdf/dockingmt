name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.16.5
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test on ubuntu-latest, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      # The uibcdf channel does not yet publish MolSysMT for Python 3.13.
      # Keep one identical source-based dependency path in every supported lane.
      - name: Check out MolSysMT 0.21.0
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysmt
          ref: "0.21.0"
          path: .molsyssuite/molsysmt
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install MolSysMT from its released source
        shell: bash -l {0}
        run: python -m pip install .molsyssuite/molsysmt --no-deps
      - name: Install dockingmt
        shell: bash -l {0}
        run: python -m pip install -e . --no-deps
      - name: Run tests with pytest-receptor
        shell: bash -l {0}
        run: pytest --receptor=ci
