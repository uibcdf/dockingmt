name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.5
      - name: Check Ruff lint
        run: ruff check .
      - name: Check Ruff format
        run: ruff format --check .

  test:
    name: Test on ubuntu-latest, Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      # The uibcdf channel does not yet publish this integrated set for Python 3.13.
      # Reviewed development revisions; hosted/context receiving remains #100.
      # Frozen manual receivers keep separate source identities; public admission is separate.
      - name: Check out compatible ArgDigest source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/argdigest
          ref: "07126411f108ee1ff607e9c9a0816109b2c9253e"
          path: .molsyssuite/argdigest
          fetch-depth: 0
      - name: Check out compatible ArgDigest source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/argdigest
          ref: "07126411f108ee1ff607e9c9a0816109b2c9253e"
          path: .molsyssuite/argdigest
          fetch-depth: 0
      - name: Check out compatible MolSysMT source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysmt
          ref: "efbe67e1c6042078144bce1db24aa80bb565dbd2"
          path: .molsyssuite/molsysmt
          fetch-depth: 0
      - name: Check out compatible MolSysMT source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysmt
          ref: "efbe67e1c6042078144bce1db24aa80bb565dbd2"
          path: .molsyssuite/molsysmt
          fetch-depth: 0
      - name: Check out compatible MolSysViewer source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysviewer
          ref: "1187fc187247aa2d20d01791856a541d50562bcb"
          path: .molsyssuite/molsysviewer
          fetch-depth: 0
      - name: Check out compatible MolSysViewer source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysviewer
          ref: "1187fc187247aa2d20d01791856a541d50562bcb"
          path: .molsyssuite/molsysviewer
          fetch-depth: 0
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install compatible scientific sibling sources
        shell: bash -l {0}
        run: >-
          python -m pip install
          .molsyssuite/argdigest
          .molsyssuite/molsysmt
          .molsyssuite/molsysviewer
          --no-deps
      - name: Install bindingmt
        shell: bash -l {0}
        run: python -m pip install . --no-deps
      - name: Check out immutable dependency SDK
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: "738fe8dd731abb99dac421b0bb2acc8564110180"
          path: .molsyssuite/sdk
          persist-credentials: false
      - name: Prepare isolated preflight tools
        shell: bash -l {0}
        run: python -m pip install --target .molsyssuite-tools "PyYAML==6.0.3" "Jinja2>=3,<4" "packaging>=24"
      - name: Check dependency routes and installed clone context
        shell: bash -l {0}
        run: |
          viewer_source=viewer-base
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            viewer_source=viewer-py314
          fi
          python devtools/check_dependency_routes.py --context ci-${{ matrix.python-version }} \
            --source-root argdigest-source=.molsyssuite/argdigest \
            --source-root molsysmt-source=.molsyssuite/molsysmt \
            --source-root "$viewer_source=.molsyssuite/molsysviewer"
      - name: Verify ordinary installed package
        shell: bash -l {0}
        run: >-
          python -I -c 'import importlib.metadata as m; import bindingmt;
          from packaging.specifiers import SpecifierSet;
          assert SpecifierSet(m.metadata("bindingmt")["Requires-Python"]) == SpecifierSet(">=3.11,<3.15");
          import pytest_receptor;
          assert m.version("pytest-receptor") == "1.2.2";
          print("Test reporter", m.version("pytest-receptor"), pytest_receptor.__file__);
          print("Installed", m.version("bindingmt"), bindingmt.__file__)'
      - name: Check installed dependency closure
        shell: bash -l {0}
        run: python -m pip check
      - name: Run tests with pytest-receptor
        shell: bash -l {0}
        env:
          PYTEST_ADDOPTS: >-
            ${{ matrix.python-version == '3.14' && '--cov=bindingmt --cov=molsysviewer_bindingmt --cov-branch --cov-report=xml:coverage.xml' || '' }}
        run: pytest --receptor=ci
      - name: Retain measured Python coverage
        if: ${{ !cancelled() && matrix.python-version == '3.14' }}
        uses: actions/upload-artifact@v4
        with:
          name: bindingmt-python-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: Distribution governance on Linux Python 3.14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check out immutable dependency SDK
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: "738fe8dd731abb99dac421b0bb2acc8564110180"
          path: .molsyssuite/sdk
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install administrative tools
        run: python -m pip install "PyYAML==6.0.3" "Jinja2>=3,<4" "packaging>=24" "pytest>=8,<10" "pytest-receptor==1.2.1" "setuptools>=77.0.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
      - name: Validate report records and generated indexes
        run: python devtools/devguide_index.py --check
      - name: Review declared dependency routes
        run: python devtools/check_dependency_routes.py --declared-only
      - name: Test distribution controls
        run: python -m pytest --receptor=ci -o addopts= devtools/tests/test_distribution_contract.py devtools/tests/test_installed_support.py devtools/tests/test_coverage_workflow.py devtools/tests/test_result_export_resources.py devtools/tests/test_source_0_1_0_qualification.py devtools/tests/test_3ptb_interaction_hosted.py tests/test_reporting_protocol.py

  coverage-upload:
    name: Publish default-branch Python coverage
    needs: test
    if: >-
      ${{ always() && !cancelled()
          && github.event_name != 'pull_request'
          && github.ref == 'refs/heads/main'
          && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind the measured Python report
        id: coverage-report
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          COVERAGE_PUBLISHER_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const run_id = context.runId;
            const publisherAttempt = Number(process.env.COVERAGE_PUBLISHER_ATTEMPT);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id, filter: 'latest', per_page: 100
            });
            const producers = jobs.filter(job => job.name === 'Test on ubuntu-latest, Python 3.14');
            if (producers.length !== 1) throw new Error('Expected one effective Python 3.14 coverage job');
            const job = producers[0];
            if (job.run_id !== run_id || job.head_sha !== context.sha || job.status !== 'completed') {
              throw new Error('Coverage job has the wrong run/source or is incomplete');
            }
            const tests = job.steps.filter(step => step.name === 'Run tests with pytest-receptor');
            const retained = job.steps.filter(step => step.name === 'Retain measured Python coverage');
            if (tests.length !== 1 || tests[0].status !== 'completed'
                || !['success', 'failure'].includes(tests[0].conclusion)
                || retained.length !== 1 || retained[0].status !== 'completed'
                || retained[0].conclusion !== 'success' || tests[0].number >= retained[0].number) {
              throw new Error('Coverage requires executed tests and successful retention');
            }
            const retention = retained[0];
            const start = Date.parse(retention.started_at);
            const end = Date.parse(retention.completed_at);
            if (!Number.isFinite(start) || !Number.isFinite(end) || start > end
                || !(Date.parse(tests[0].completed_at) <= start)) {
              throw new Error('Coverage retention timing is incomplete or inconsistent');
            }
            // Partial reruns can relabel a reused job's ID/attempt. Its execution
            // timestamps still identify the actual successful retention operation.
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id, per_page: 100
            });
            const prefix = `bindingmt-python-coverage-${run_id}-`;
            const matches = artifacts.filter(artifact => artifact.name.startsWith(prefix)
              && Date.parse(artifact.created_at) >= start && Date.parse(artifact.created_at) <= end);
            if (matches.length !== 1) throw new Error('Expected one coverage artifact from the actual retention step');
            const artifact = matches[0];
            const suffix = artifact.name.slice(prefix.length);
            const producerAttempt = Number(suffix);
            if (!/^[1-9][0-9]*$/.test(suffix) || !Number.isSafeInteger(producerAttempt)
                || !Number.isSafeInteger(publisherAttempt) || producerAttempt > publisherAttempt
                || publisherAttempt < 1 || !Number.isSafeInteger(artifact.id) || artifact.id < 1
                || artifact.expired !== false || artifact.workflow_run?.id !== run_id
                || artifact.workflow_run?.head_sha !== context.sha) {
              throw new Error('Coverage artifact has invalid attempt, expiry or source identity');
            }
            core.info(JSON.stringify({run_id, source_sha: context.sha,
              producer_attempt: producerAttempt, publisher_attempt: publisherAttempt,
              artifact_id: artifact.id, retention_started_at: retention.started_at,
              retention_completed_at: retention.completed_at}));
            core.setOutput('artifact-id', String(artifact.id));
            core.setOutput('producer-attempt', String(producerAttempt));
      - name: Download the measured Python report
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.coverage-report.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          merge-multiple: true
          path: coverage-report
      - name: Upload the measured report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-report/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          override_commit: ${{ github.sha }}
          override_branch: main
          name: codecov-linux-py3.14
