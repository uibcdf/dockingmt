name: Full compatibility matrix

on:
  schedule:
    - cron: "17 9 * * TUE"
    - cron: "19 1 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '19 1 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  full-test:
    name: Full test on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    needs: nightly-decision
    if: >-
      always() && inputs.probe_backlog != true
      && (github.event_name != 'schedule' || github.event.schedule != '19 1 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    concurrency:
      group: ci-full-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python-version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-15
            python-version: "3.13"
          - os: macos-15
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      # The uibcdf channel does not yet publish this integrated set for Python 3.13.
      # Exact current sibling composition is qualified under dockingmt#49.
      # Both Viewer contexts now use the same source; public pair admission is separate.
      - name: Check out compatible ArgDigest source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/argdigest
          ref: "3d1ec53c374098016452abab74706e9d80df5462"
          path: .molsyssuite/argdigest
          fetch-depth: 0
      - name: Check out compatible ArgDigest source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/argdigest
          ref: "3d1ec53c374098016452abab74706e9d80df5462"
          path: .molsyssuite/argdigest
          fetch-depth: 0
      - name: Check out compatible MolSysMT source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysmt
          ref: "c35252d89a28a8faff11e0014bda91312167f549"
          path: .molsyssuite/molsysmt
          fetch-depth: 0
      - name: Check out compatible MolSysMT source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysmt
          ref: "c35252d89a28a8faff11e0014bda91312167f549"
          path: .molsyssuite/molsysmt
          fetch-depth: 0
      - name: Check out compatible MolSysViewer source
        if: matrix.python-version != '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysviewer
          ref: "a61b75bc994e3ad674c3e7eafe53bb6b2a989c5f"
          path: .molsyssuite/molsysviewer
          fetch-depth: 0
      - name: Check out compatible MolSysViewer source for Python 3.14
        if: matrix.python-version == '3.14'
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsysviewer
          ref: "a61b75bc994e3ad674c3e7eafe53bb6b2a989c5f"
          path: .molsyssuite/molsysviewer
          fetch-depth: 0
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
      - name: Install compatible scientific sibling sources
        shell: bash -l {0}
        run: >-
          python -m pip install
          .molsyssuite/argdigest
          .molsyssuite/molsysmt
          .molsyssuite/molsysviewer
          --no-deps
      - name: Install dockingmt
        shell: bash -l {0}
        run: python -m pip install . --no-deps
      - name: Verify interpreter, architecture and required backend
        shell: bash -l {0}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PYTHON'
          import os
          import platform
          import sys
          import vina
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
          if sys.platform == "darwin":
              assert platform.machine() == "arm64", platform.machine()
          print("Python", platform.python_version(), "architecture", platform.machine(), "Vina", vina.__version__)
          PYTHON
      - name: Check out immutable dependency SDK
        uses: actions/checkout@v6
        with:
          repository: uibcdf/molsyssuite
          ref: "738fe8dd731abb99dac421b0bb2acc8564110180"
          path: .molsyssuite/sdk
          persist-credentials: false
      - name: Prepare isolated preflight tools
        shell: bash -l {0}
        run: python -m pip install --target .molsyssuite-tools "PyYAML==6.0.3" "Jinja2>=3,<4" "packaging>=24"
      - name: Check dependency routes and installed clone context
        shell: bash -l {0}
        run: |
          viewer_source=viewer-base
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            viewer_source=viewer-py314
          fi
          python devtools/check_dependency_routes.py --context ci-${{ matrix.python-version }} \
            --source-root argdigest-source=.molsyssuite/argdigest \
            --source-root molsysmt-source=.molsyssuite/molsysmt \
            --source-root "$viewer_source=.molsyssuite/molsysviewer"
      - name: Verify ordinary installed package
        shell: bash -l {0}
        run: >-
          python -I -c 'import importlib.metadata as m; import dockingmt;
          from packaging.specifiers import SpecifierSet;
          assert SpecifierSet(m.metadata("dockingmt")["Requires-Python"]) == SpecifierSet(">=3.11,<3.15");
          print("Installed", m.version("dockingmt"), dockingmt.__file__)'
      - name: Check installed dependency closure
        shell: bash -l {0}
        run: python -m pip check
      - name: Run tests with pytest-receptor
        shell: bash -l {0}
        run: pytest --receptor=ci
